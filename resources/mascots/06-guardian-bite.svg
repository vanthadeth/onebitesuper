<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="06-guardian-bite-title 06-guardian-bite-desc"><title id="06-guardian-bite-title">OneBite Guardian Bite mascot</title><desc id="06-guardian-bite-desc">Friendly dumpling character. Admin permissions and secure confirmations.</desc><style>
.mascot-motion{transform-box:view-box;transform-origin:160px 280px;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@keyframes wave{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}60%{transform:rotate(3deg)}}
@keyframes nod{0%,100%{transform:translateY(0)}50%{transform:translateY(4px) scaleY(.985)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes tick{0%,100%{transform:rotate(0)}45%{transform:rotate(2deg)}55%{transform:rotate(-1deg)}}
@keyframes steady{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
@keyframes hop{0%,65%,100%{transform:translateY(0)}25%{transform:translateY(-7px)}40%{transform:translateY(0) scaleY(.985)}}
@keyframes ponder{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-3deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025,1.015)}}
@media(prefers-reduced-motion:reduce){.mascot-motion{animation:none!important}}
