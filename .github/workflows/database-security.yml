name: Database security
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  database-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: isolated-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: isolated-test-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: psql -v ON_ERROR_STOP=1 -f supabase/local-test-bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/admin-access.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261009133347_fix_activity_cursor_validation.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010000648_security_hardening.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010025205_seven_day_owner_only_authentication.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/security-hardening.verify.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010054118_profile_photos.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010055908_profile_photo_lock_order.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/profile-photos.verify.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010122414_inventory_catalog.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/inventory-catalog.verify.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010150108_inventory_references.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/inventory-references.verify.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011013840_inventory_recipes.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/inventory-recipes.verify.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011022212_seven_day_owner_verification.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/seven-day-verification.verify.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011042516_unified_item_catalog.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/unified-catalog.verify.sql
